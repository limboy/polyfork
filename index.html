<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polyfork</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <aside>
      <div class="controls">
        <div class="row">
          <input id="search" placeholder="搜索名称…" autocomplete="off" />
          <button id="openDownload" class="primary" title="从 polyfork.dev 下载">＋ 下载</button>
        </div>
        <div class="row">
          <select id="kit"><option value="">全部套件</option></select>
          <select id="cls"><option value="">全部类别</option></select>
        </div>
        <div class="row">
          <select id="group" title="分组">
            <option value="">不分组</option>
            <option value="kit">按套件分组</option>
            <option value="class">按类别分组</option>
            <option value="size">按尺寸分组</option>
            <option value="tris">按面数分组</option>
            <option value="rig">按是否可动分组</option>
          </select>
        </div>
        <div class="row count">
          <span id="count"></span>
          <button id="openFolder" class="link">打开文件夹</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </aside>

    <main>
      <canvas id="c"></canvas>
      <div class="info" id="info" hidden></div>
      <div class="toolbar">
        <label><input type="checkbox" id="rotate" checked /> 自动旋转</label>
        <label><input type="checkbox" id="wire" /> 线框</label>
        <label><input type="checkbox" id="gridToggle" checked /> 地面网格</label>
        <button id="reset">重置视角</button>
        <label id="animWrap" hidden>动画 <select id="anim"></select></label>
      </div>
      <div class="toolbar right" id="modelActions" hidden>
        <button id="openPage">Polyfork 页面</button>
        <div class="menu-wrap">
          <button id="more" title="更多">···</button>
          <div class="menu" id="moreMenu" hidden>
            <button id="remove" class="danger">删除</button>
          </div>
        </div>
      </div>
      <div class="empty" id="empty">加载中…</div>
    </main>

    <dialog id="download">
      <form id="downloadForm" method="dialog">
        <h2>从 polyfork.dev 下载</h2>
        <p class="muted">免费的低多边形模型，GLB 格式，不需要账号。至少选一项。</p>
        <label class="check"><input type="checkbox" id="dlAll" /> 全部下载 <span id="dlAllInfo"></span></label>
        <label>套件
          <select id="dlKit"><option value="">（不限）</option></select>
        </label>
        <label>搜索词 <input id="dlQuery" placeholder="例如 tree、car、chair" autocomplete="off" /></label>
        <label>类别 <select id="dlClass"><option value="">（不限）</option></select></label>
        <label>数量上限 <input id="dlLimit" type="number" min="0" placeholder="0 = 不限" /></label>
        <div class="progress" id="dlProgress" hidden>
          <div class="bar"><div id="dlBar"></div></div>
          <div class="muted" id="dlStatus"></div>
        </div>
        <div class="error" id="dlError" hidden></div>
        <div class="actions">
          <button type="button" id="dlCancel">关闭</button>
          <button type="submit" id="dlStart" class="primary">开始下载</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
